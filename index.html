<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>টুডু লিস্ট</title>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#758198; --primary:#4f46e5; --line:#e7ebf2; --danger:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(135deg,#eef2ff,#f8fafc); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app { width:min(680px,calc(100% - 28px)); margin:48px auto; }
    h1 { margin:0 0 20px; font-size:28px; }
    .composer { display:flex; gap:10px; padding:14px; background:var(--card); border-radius:16px; box-shadow:0 10px 30px rgba(30,41,59,.08); }
    input[type="text"] { flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:16px; color:var(--text); outline:none; }
    input[type="text"]:focus { border-color:#818cf8; box-shadow:0 0 0 3px rgba(129,140,248,.15); }
    button { border:0; border-radius:10px; cursor:pointer; font-weight:700; }
    .add { background:var(--primary); color:#fff; padding:12px 18px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px; }
    .filters { display:flex; gap:6px; }
    .filter { background:transparent; color:var(--muted); padding:8px 10px; }
    .filter.active { background:#e0e7ff; color:#3730a3; }
    .clear { background:transparent; color:var(--danger); }
    .list { display:grid; gap:8px; }
    .task { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
    .task.done .text { color:var(--muted); text-decoration:line-through; }
    .check { width:20px; height:20px; accent-color:var(--primary); }
    .text { flex:1; overflow-wrap:anywhere; }
    .delete { background:#fee2e2; color:#b91c1c; width:34px; height:34px; }
    .empty { text-align:center; color:var(--muted); background:rgba(255,255,255,.55); border-radius:12px; padding:28px 12px; }
    @media(max-width:480px){.app{margin:24px auto}.toolbar{align-items:flex-start}.composer{padding:10px}.add{padding-inline:12px}}
  </style>
</head>
<body>
  <main class="app">
    <h1>টুডু লিস্ট</h1>
    <form class="composer" id="form">
      <input id="input" type="text" placeholder="নতুন কাজ লিখুন..." aria-label="নতুন কাজ" maxlength="200" autocomplete="off">
      <button class="add" type="submit">যোগ করুন</button>
    </form>

    <div class="toolbar">
      <div class="filters" aria-label="ফিল্টার">
        <button class="filter active" data-filter="all">সব</button>
        <button class="filter" data-filter="active">অসমাপ্ত</button>
        <button class="filter" data-filter="done">সম্পন্ন</button>
      </div>
      <button class="clear" id="clearDone">সম্পন্নগুলো মুছুন</button>
    </div>

    <div class="list" id="list"></div>
  </main>

  <script>
    const STORAGE_KEY = 'todo-list-items';
    let tasks = loadTasks();
    let filter = 'all';

    const form = document.querySelector('#form');
    const input = document.querySelector('#input');
    const list = document.querySelector('#list');

    function loadTasks() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function escapeHTML(value) {
      const div = document.createElement('div');
      div.textContent = value;
      return div.innerHTML;
    }

    function render() {
      const visible = tasks.filter(task =>
        filter === 'all' || (filter === 'active' && !task.done) || (filter === 'done' && task.done)
      );

      if (!visible.length) {
        list.innerHTML = '<div class="empty">কোনো কাজ নেই</div>';
        return;
      }

      list.innerHTML = visible.map(task => `
        <div class="task ${task.done ? 'done' : ''}" data-id="${task.id}">
          <input class="check" type="checkbox" ${task.done ? 'checked' : ''} aria-label="কাজের অবস্থা">
          <span class="text">${escapeHTML(task.text)}</span>
          <button class="delete" type="button" aria-label="কাজ মুছুন">×</button>
        </div>
      `).join('');
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now().toString(), text, done: false });
      input.value = '';
      saveTasks();
      render();
      input.focus();
    });

    list.addEventListener('change', event => {
      if (!event.target.classList.contains('check')) return;
      const taskElement = event.target.closest('.task');
      const task = tasks.find(item => item.id === taskElement.dataset.id);
      if (task) {
        task.done = event.target.checked;
        saveTasks();
        render();
      }
    });

    list.addEventListener('click', event => {
      const button = event.target.closest('.delete');
      if (!button) return;
      const taskElement = button.closest('.task');
      tasks = tasks.filter(item => item.id !== taskElement.dataset.id);
      saveTasks();
      render();
    });

    document.querySelectorAll('.filter').forEach(button => {
      button.addEventListener('click', () => {
        filter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        render();
      });
    });

    document.querySelector('#clearDone').addEventListener('click', () => {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
